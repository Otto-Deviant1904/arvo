<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>s09_how</title>
<link rel="stylesheet" href="lib/line.css">
<script src="lib/line.js"></script>
<script src="lib/mel.js"></script>
<script src="lib/diagram.js"></script>
</head>
<body>
<script>
// s09_how (nominal = rendered length 16.2 s = narration 15.3 + 0.9; narration starts at 0.35 s).
// Narration: "The model reads, code decides." 0.50-2.54 | "Gemma never picks a price, an item number or a
// deadline." 2.99-6.31 | "Code does, from the Schedule." 6.85-8.35 | "Let Gemma price the week itself:"
// 8.85-10.73 | "zero of sixteen right." 11.07-12.57 | "A flag must quote the note," 13.06-14.44 |
// "or it's dropped." 14.59-15.49
// A 0-8.4    the machine: phone / diary photo / mic hop into "Gemma reads" (the gem reads, scan line),
//            shift cards slide out and into "code decides" (gears). Price / item number / deadline tokens
//            pop up by the gem, it shakes its head, each one flies into the Schedule book (gulp). The book
//            hops, the gears whirr, an invoice slides out, lines draw on, total.
// B 8.4-12.9 the gem prices the week itself, pencil in hand; big red cross; "0 / 16"; sweat drop, pencil falls.
// C 12.9-end a flag card quoting the note: magnifier checks it against the note, green tick. A second
//            card whose quote is not in the note: no match, it tips and drops out of frame.
(function () {
  const L = Line, C = L.C, D = Diagram;
  const LEN = 16.2, CUT1 = 8.4, CUT2 = 12.9;
  const GB = { x: 440, y: 330, w: 340, h: 320 }, CB = { x: 1060, y: 330, w: 340, h: 320 };
  const HOP = [610, 262];

  // ---------- props (local coordinates, centred on 0,0)
  function phone() {
    return [
      { cmds: L.rrect(-38, -64, 76, 128, 14, 101), fill: C.body, width: 6.5 },
      { cmds: L.rrect(-28, -49, 56, 94, 6, 102, 0.6), fill: C.screen, stroke: null },
      { cmds: D.scribble(-19, -30, 36, 1, 1.5), stroke: C.bg, width: 4 },
      { cmds: D.scribble(-19, -13, 30, 2, 1.5), stroke: C.bg, width: 4 },
      { cmds: D.scribble(-19, 4, 38, 3, 1.5), stroke: C.bg, width: 4 },
      { cmds: D.scribble(-19, 21, 22, 4, 1.5), stroke: C.bg, width: 4 },
      { cmds: L.poly([[-10, -57], [10, -57]]), width: 4.5 },
    ];
  }
  function diaryPhoto() {
    const page = [
      { cmds: L.rrect(-40, -36, 84, 70, 3, 113, 0.5), fill: C.screen, stroke: null },
      { cmds: D.scribble(-24, -18, 52, 5, 1.6), stroke: C.bg, width: 3.6 },
      { cmds: D.scribble(-24, -3, 44, 6, 1.6), stroke: C.bg, width: 3.6 },
      { cmds: D.scribble(-24, 12, 56, 7, 1.6), stroke: C.bg, width: 3.6 },
    ];
    for (let i = 0; i < 4; i++) page.push({ cmds: L.blob(-34, -26 + i * 17, 3.4, 3.4, 120 + i, 0.02), fill: C.bg, stroke: null });
    return [
      { cmds: L.rrect(-72, -60, 144, 120, 6, 111), fill: C.line, width: 5 },
      { cmds: L.rrect(-61, -49, 122, 84, 3, 112, 0.5), fill: C.bg, stroke: null },
      ...D.place(page, { x: 0, y: -7, rot: -9 }),
    ];
  }
  function mic(tn) {
    const it = [
      { cmds: L.rrect(-24, -74, 48, 80, 24, 131), fill: C.body, width: 6.5 },
      { cmds: L.poly([[-15, -50], [15, -50]]), width: 3.6, strokeOpacity: 0.7 },
      { cmds: L.poly([[-17, -36], [17, -36]]), width: 3.6, strokeOpacity: 0.7 },
      { cmds: L.poly([[-17, -22], [17, -22]]), width: 3.6, strokeOpacity: 0.7 },
      { cmds: L.curve([[-38, -30], [-36, 6], [0, 20], [36, 6], [38, -30]], false, 0.9), width: 6 },
      { cmds: L.poly([[0, 20], [0, 50]]), width: 6.5 },
      { cmds: L.curve([[-30, 54], [0, 51], [30, 54]]), width: 6.5 },
    ];
    // sound waves breathe outwards
    [0, 1].forEach((k) => {
      const ph = ((tn * 1.4 + k * 0.5) % 1);
      const r = 52 + ph * 26, op = Math.sin(ph * Math.PI) * 0.9;
      [-1, 1].forEach((sd) => {
        const pts = [];
        for (let i = 0; i <= 6; i++) { const a = (-38 + i * 12.7) * L.D2R; pts.push([sd * Math.cos(a) * r, -30 + Math.sin(a) * r]); }
        it.push({ cmds: L.curve(pts), width: 5, wEnd: 2.4, strokeOpacity: op, boil: 0.2 });
      });
    });
    return it;
  }
  function card(seed) {
    return [
      { cmds: L.rrect(-60, -38, 120, 76, 10, 140 + seed), fill: C.screen, stroke: C.line, width: 5 },
      { cmds: L.blob(-34, -10, 13, 13, 150 + seed, 0.02), stroke: C.bg, width: 3.8 },
      { cmds: L.poly([[-34, -18], [-34, -10], [-27, -6]]), stroke: C.bg, width: 3.4, taper: false },
      { cmds: D.scribble(-12, -16, 52, seed, 1.4), stroke: C.bg, width: 4 },
      { cmds: D.scribble(-12, 0, 38, seed + 3, 1.4), stroke: C.bg, width: 4 },
      { cmds: D.scribble(-44, 20, 70, seed + 5, 1.4), stroke: C.bg, width: 4, strokeOpacity: 0.6 },
    ];
  }
  function token(kind) {
    const it = [{ cmds: L.blob(0, 0, 38, 38, 160, 0.02), fill: C.body, width: 6 }];
    if (kind === 0) it.push({ text: "$", x: 0, y: 17, size: 50, weight: 700, fill: C.amber, anchor: "middle" });
    else if (kind === 1) it.push({ text: "#", x: 0, y: 16, size: 46, weight: 700, fill: C.amber, anchor: "middle" });
    else {
      it.push({ cmds: L.rrect(-21, -16, 42, 36, 5, 161, 0.5), stroke: C.amber, width: 4.5 });
      it.push({ cmds: L.poly([[-21, -6], [21, -6]]), stroke: C.amber, width: 4, taper: false });
      it.push({ cmds: L.poly([[-10, -22], [-10, -11]]), stroke: C.amber, width: 4.5 });
      it.push({ cmds: L.poly([[10, -22], [10, -11]]), stroke: C.amber, width: 4.5 });
      [[-10, 4], [0, 4], [10, 4], [-10, 12], [0, 12]].forEach(([x, y], i) => it.push({ cmds: L.blob(x, y, 2.4, 2.4, 170 + i, 0), fill: C.amber, stroke: null, boil: 0.1 }));
    }
    return it;
  }
  function book() {
    return [
      { cmds: L.rrect(-100, -118, 212, 124, 8, 181), fill: C.screen, width: 5.5 },
      { cmds: L.rrect(-108, -126, 210, 124, 8, 182), fill: C.amber, width: 6.5 },
      { cmds: L.poly([[-84, -124], [-84, -4]]), stroke: C.bg, width: 4.5, strokeOpacity: 0.6 },
      { text: "Schedule", x: 6, y: -72, size: 37, weight: 700, fill: C.bg, anchor: "middle", jit: 0.2 },
      { text: "2026-27", x: 6, y: -30, size: 33, weight: 650, fill: C.bg, anchor: "middle", jit: 0.2 },
    ];
  }
  function invoice(tn, t0) {
    const it = [{ cmds: L.rrect(-130, -165, 260, 330, 10, 191), fill: C.screen, width: 6 }];
    const at = (k) => (t0 == null ? {} : { at: t0 + k * 0.1, dur: 0.16 });
    it.push(Object.assign({ cmds: D.scribble(-100, -122, 110, 2, 1.8), stroke: C.bg, width: 6.5 }, at(0)));
    [-70, -30, 10, 50].forEach((y, i) => {
      it.push(Object.assign({ cmds: D.scribble(-100, y, 120 - (i % 2) * 30, 10 + i, 1.5), stroke: C.bg, width: 4.2 }, at(1 + i)));
      it.push(Object.assign({ cmds: D.scribble(50, y, 50, 20 + i, 1.5), stroke: C.bg, width: 4.2 }, at(1.4 + i)));
    });
    it.push(Object.assign({ cmds: L.poly([[-104, 84], [104, 84]]), stroke: C.bg, width: 3.6, taper: false }, at(5)));
    const tp = t0 == null ? 1 : L.clamp((tn - t0 - 0.62) / 0.2);
    if (tp > 0) it.push({ cmds: L.rrect(-110, 98, 220, 46, 10, 192, 0.6), fill: C.amber, fillOpacity: 0.85 * tp, stroke: null });
    it.push(Object.assign({ text: "total", x: -96, y: 132, size: 32, weight: 700, fill: C.bg, mode: "fade" }, t0 == null ? {} : { at: t0 + 0.6, dur: 0.15 }));
    it.push(Object.assign({ cmds: D.scribble(30, 120, 66, 31, 2), stroke: C.bg, width: 6.5 }, at(6.4)));
    return it;
  }

  // ---------- motion helpers
  function hop(tn, th, home, target) {
    const a = tn - th;
    if (a < -0.16) return { x: home[0], y: home[1], sx: 1, sy: 1, rot: 0, s: 1, in: false };
    if (a < 0) {
      const u = L.ease.out((a + 0.16) / 0.16);
      return { x: home[0], y: home[1] + 8 * u, sx: 1 + 0.16 * u, sy: 1 - 0.18 * u, rot: 0, s: 1, in: false };
    }
    const F = 0.44;
    if (a < F) {
      const u = a / F;
      const st = D.key(u, [[0, 1.2], [0.25, 1.05], [0.6, 1], [1, 1.1]]);
      return { x: L.lerp(home[0], target[0], u), y: L.lerp(home[1], target[1], u) - 230 * 4 * u * (1 - u), sx: 1 / st, sy: st,
        rot: 14 * Math.sin(u * Math.PI) * (home[1] > 500 ? -1 : 1), s: L.lerp(1, 0.66, L.ease.in2(u)), in: false };
    }
    const u = L.clamp((a - F) / 0.18);
    return { x: target[0], y: target[1] + 150 * L.ease.in2(u), sx: 0.92, sy: 1.1, rot: 0, s: 0.66, in: u >= 1 };
  }
  let gearAngleCache = { t: -1, a: 0 };
  function gearAngle(tn) {
    const speed = (t) => 34 + 160 * Math.max(0, Math.sin(L.clamp((t - 2.6) / 1.0) * Math.PI)) + 330 * Math.max(0, Math.sin(L.clamp((t - 6.9) / 1.5) * Math.PI));
    let a = 0;
    for (let t = 0; t < tn; t += 1 / 60) a += speed(t) / 60;
    return a;
  }
  void gearAngleCache;

  const INPUTS = [
    { draw: () => phone(), home: [262, 312], th: 0.62 },
    { draw: () => diaryPhoto(), home: [262, 492], th: 0.9 },
    { draw: (tn) => mic(tn), home: [262, 680], th: 1.18 },
  ];
  const TOK = [3.62, 4.52, 5.46];
  const BOOK = [1236, 330];

  function shotA(tn) {
    const it = [];
    // invoice (behind the code box, slides out to the right)
    const ip = L.clamp((tn - 7.25) / 0.42);
    if (ip > 0) {
      const x = L.lerp(1250, 1630, L.ease.back(ip));
      const rot = D.wob(tn, 7.6, 4, 2.2, 5);
      it.push({ type: "group", rotate: { deg: rot, x: 1630, y: 650 }, items: D.place(invoice(tn, 7.55), { x, y: 488 }) });
    }
    // shift cards: out of the gem box, stack on the belt, then into the code box
    for (let i = 0; i < 3; i++) {
      const te = 1.98 + i * 0.15;
      if (tn < te) continue;
      const out = L.ease.back(L.clamp((tn - te) / 0.34));
      const go = L.ease.inOut(L.clamp((tn - 2.62) / 0.42));
      if (go >= 1) continue;
      const x = L.lerp(700, 905 + i * 8, out) + go * 300;
      const y = 607 - i * 9;
      const rot = D.wob(tn, te + 0.3, 7, 2.6, 6) + (i - 1) * 2 - D.wob(tn, 2.62, 5, 2, 5) * (1 - go);
      it.push({ type: "group", rotate: { deg: rot, x, y: y + 36 }, items: D.place(card(i * 7 + 1), { x, y }) });
    }
    // inputs: idle bob, then hop into the hopper
    INPUTS.forEach((inp, i) => {
      const pp = D.popS(tn, 0.2 + i * 0.07, { sq: 0.12 });
      if (pp.s <= 0.01) return;
      const h = hop(tn, inp.th, inp.home, [HOP[0], HOP[1] - 6]);
      if (h.in) return;
      const bob = tn < inp.th - 0.16 ? Math.sin(tn * 3.2 + i * 1.7) * 3 : 0;
      const items = D.place(inp.draw(tn), { x: h.x, y: h.y + bob, sx: h.sx * pp.sx * h.s, sy: h.sy * pp.sy * h.s, rot: h.rot });
      if (tn > inp.th + 0.3) it.push({ type: "group", clip: [["M", 0, -200], ["L", 1920, -200], ["L", 1920, GB.y + 2], ["L", 0, GB.y + 2], ["Z"]], items });
      else it.push(...items);
    });
    // boxes (quick establishing draw-on)
    it.push({ cmds: L.rrect(GB.x, GB.y, GB.w, GB.h, 22, 201), fill: C.body, width: 7, at: 0.0, dur: 0.42 });
    it.push({ cmds: L.rrect(CB.x, CB.y, CB.w, CB.h, 22, 202), fill: C.body, width: 7, at: 0.12, dur: 0.42 });
    // hopper: a gap in the gem box's lid with a funnel
    it.push({ cmds: L.poly([[545, GB.y], [675, GB.y]]), stroke: C.body, width: 14, taper: false, at: 0.3, dur: 0.01 });
    it.push({ cmds: L.curve([[498, 258], [522, 296], [548, 333]]), width: 7, at: 0.3, dur: 0.16 });
    it.push({ cmds: L.curve([[722, 258], [698, 296], [672, 333]]), width: 7, at: 0.34, dur: 0.16 });
    // belt + rollers between the boxes
    it.push({ cmds: L.curve([[784, 648], [920, 647], [1056, 648]]), width: 6.5, at: 0.32, dur: 0.2 });
    const roll = gearAngle(tn) * 2.2;
    [826, 888, 950, 1012].forEach((x, i) => {
      if (tn < 0.4 + i * 0.03) return;
      const a = (roll + i * 40) * L.D2R;
      it.push({ cmds: L.blob(x, 664, 12, 12, 210 + i, 0.02), width: 4.6 });
      it.push({ cmds: L.poly([[x - Math.cos(a) * 9, 664 - Math.sin(a) * 9], [x + Math.cos(a) * 9, 664 + Math.sin(a) * 9]]), width: 3.6, taper: false });
    });
    // the gem, inside its box
    const gp = D.popS(tn, 0.38, { sq: 0.14 });
    if (gp.s > 0.01) {
      const drops = INPUTS.map((inp) => inp.th + 0.5);
      let sq = 0;
      drops.forEach((t0) => (sq += D.wob(tn, t0, 0.09, 3.4, 7)));
      let rot = 0, look = [0, 0], mood = "smile", blink = D.within(tn, [1.0, 3.15, 6.55], 0.14);
      // look up at arrivals, read left-right, then watch the cards
      if (tn > 0.55 && tn < 1.75) look = [0.2, -1];
      if (tn >= 1.4 && tn < 2.3) look = [Math.sin((tn - 1.4) * 9), 0.3];
      if (tn >= 2.3 && tn < 3.5) look = [1, 0.4];
      TOK.forEach((t0) => {
        if (tn > t0 && tn < t0 + 0.55) { look = [0.3, -1]; mood = "flat"; }
        const v = tn - (t0 + 0.12);
        if (v > 0 && v < 0.42) { rot += 10 * Math.sin(v / 0.42 * Math.PI * 3) * Math.sin(v / 0.42 * Math.PI); look = [Math.sin(v / 0.42 * Math.PI * 3), 0]; blink = true; }
        if (tn > t0 + 0.5 && tn < t0 + 0.95) look = [1, -0.6];
      });
      if (tn > 6.8) { look = [1, 0]; mood = "smile"; }
      it.push(...D.gem({ x: 610, y: 512 + 8 * Math.sin(tn * 2.1), r: 96, tn, sx: gp.sx * (1 + sq), sy: gp.sy * (1 - sq), px: 0, py: 0, rot, look, mood, blink }));
    }
    // the gem reads: a scan line sweeps the box
    if (tn > 1.3 && tn < 2.45) {
      const u = (tn - 1.3) / 1.15, y = 400 + 200 * (0.5 - 0.5 * Math.cos(u * Math.PI * 2 * 1.5));
      const op = Math.sin(u * Math.PI);
      const sc = [];
      sc.push({ cmds: L.rrect(GB.x + 16, y - 18, GB.w - 32, 36, 12, 230, 0.4), fill: C.amber, fillOpacity: 0.12 * op, stroke: null, boil: 0 });
      sc.push({ cmds: L.poly([[GB.x + 18, y], [GB.x + GB.w - 18, y]]), stroke: C.amber, width: 5, strokeOpacity: op });
      sc.push({ cmds: L.poly([[GB.x + 30, y - 12], [GB.x + GB.w - 30, y - 12]]), stroke: C.amber, width: 3, strokeOpacity: 0.4 * op });
      sc.push({ cmds: L.poly([[GB.x + 30, y + 12], [GB.x + GB.w - 30, y + 12]]), stroke: C.amber, width: 3, strokeOpacity: 0.4 * op });
      it.push(...sc);
    }
    // gears (code decides)
    if (tn > 0.25) {
      const a = gearAngle(tn);
      const gs = D.popS(tn, 0.3, { sq: 0.1 }).s, gs2 = D.popS(tn, 0.38, { sq: 0.1 }).s;
      it.push(...D.place(D.gear(0, 0, 84, 11, a), { x: 1180, y: 535, s: gs }));
      it.push(...D.place(D.gear(0, 0, 54, 7, -a * 11 / 7 + 12), { x: 1300, y: 437, s: gs2 }));
    }
    // the Schedule book on the code box: gulps each token, hops on "from the Schedule"
    if (tn > 0.4) {
      const bp = D.popS(tn, 0.42, { sq: 0.12 });
      let sx = bp.sx, sy = bp.sy, dy = 0;
      TOK.forEach((t0) => { const w = D.wob(tn, t0 + 0.98, 0.12, 3.2, 8); sx *= 1 + w; sy *= 1 - w; });
      const hopY = D.key(tn, [[6.82, 0], [6.94, 6, "out"], [7.12, -46, "out"], [7.3, 0, "in2"]]);
      const hs = D.key(tn, [[6.82, 1], [6.94, 0.86], [7.06, 1.12, "out"], [7.28, 1.0], [7.33, 0.86, "out"], [7.48, 1.04], [7.6, 1]]);
      dy = hopY; sy *= hs; sx /= Math.sqrt(hs);
      it.push(...D.place(book(), { x: BOOK[0], y: BOOK[1] + dy, sx, sy, px: 0, py: 0 }));
      // glow rays when it hops
      const rp = L.clamp((tn - 7.0) / 0.5);
      if (rp > 0 && rp < 1) {
        [-160, -125, -90, -55, -20].forEach((deg, i) => {
          const a = deg * L.D2R, r0 = 140 + 30 * L.ease.out(rp), r1 = r0 + 34 * Math.sin(rp * Math.PI);
          const cx = BOOK[0], cy = BOOK[1] - 62 + dy;
          it.push({ cmds: L.poly([[cx + Math.cos(a) * r0 * 0.95, cy + Math.sin(a) * r0 * 0.62], [cx + Math.cos(a) * r1 * 0.95, cy + Math.sin(a) * r1 * 0.62]]), stroke: C.amber, width: 6, wEnd: 3, strokeOpacity: Math.sin(rp * Math.PI) });
          void i;
        });
      }
    }
    // labels
    const lab = (t0, text, x) => {
      const p = D.popS(tn, t0, { sq: 0.1 });
      if (p.s > 0.01) it.push({ type: "group", scale: { s: p.sx, sy: p.sy, x, y: 722 }, items: [{ text, x, y: 740, size: 54, weight: 650, anchor: "middle" }] });
    };
    lab(0.72, "Gemma reads", GB.x + GB.w / 2);
    lab(1.78, "code decides", CB.x + CB.w / 2);
    // tokens: pop by the gem, it shakes its head, they fly into the book
    TOK.forEach((t0, k) => {
      const p = D.popS(tn, t0, { sq: 0.18 });
      if (p.s <= 0.01) return;
      const tf = t0 + 0.55, u = L.clamp((tn - tf) / 0.44);
      if (u >= 1) return;
      const home = [560 + k * 50, 186 + (k % 2) * 6];
      const tgt = [BOOK[0] - 6, BOOK[1] - 70];
      const ue = L.ease.inOut(u);
      const x = L.lerp(home[0], tgt[0], ue), y = L.lerp(home[1], tgt[1], ue) - 150 * Math.sin(ue * Math.PI) + Math.sin(tn * 4 + k) * 4 * (1 - u);
      const s = p.s * (u > 0.82 ? 1 - (u - 0.82) / 0.18 : 1);
      // anticipation: lean back before the throw
      const lean = D.key(tn, [[tf - 0.14, 0], [tf - 0.02, -10], [tf + 0.1, 16], [tf + 0.44, 360]]);
      it.push({ type: "group", rotate: { deg: lean, x, y }, items: D.place(token(k), { x, y, sx: s * (p.sx / Math.max(0.01, p.s)), sy: s * (p.sy / Math.max(0.01, p.s)) }) });
    });
    return it;
  }

  // ---------- B: the gem prices the week itself
  const PAPER = { x: 330, y: 200, w: 420, h: 560 };
  const ROWS = [340, 420, 500, 580];
  const WR = [[9.05, 9.42], [9.52, 9.89], [9.99, 10.36], [10.46, 10.83]];
  function shotB(tn) {
    const it = [];
    // paper with pre-printed shift lines
    const pp = L.ease.back(L.clamp((tn - CUT1) / 0.32));
    const py = 600 * (1 - pp);
    const paper = [{ cmds: L.rrect(PAPER.x, PAPER.y, PAPER.w, PAPER.h, 14, 301), fill: C.screen, width: 6.5 }];
    paper.push({ cmds: D.scribble(PAPER.x + 40, 262, 170, 3, 2), stroke: C.bg, width: 7 });
    ROWS.forEach((y, i) => paper.push({ cmds: D.scribble(PAPER.x + 40, y, 150 - (i % 2) * 40, 40 + i, 1.6), stroke: C.bg, width: 4.6, strokeOpacity: 0.75 }));
    paper.push({ cmds: L.poly([[PAPER.x + 36, 640], [PAPER.x + PAPER.w - 36, 640]]), stroke: C.bg, width: 3.6, taper: false });
    paper.push({ text: "total", x: PAPER.x + 40, y: 700, size: 38, weight: 700, fill: C.bg });
    // the amounts the gem writes (revealed behind the pencil)
    let tip = null;
    const rowsAll = ROWS.concat([690]);
    const WRall = WR.concat([[10.9, 11.08]]);
    rowsAll.forEach((y, i) => {
      const [a, b] = WRall[i];
      const p = L.clamp((tn - a) / (b - a));
      if (p <= 0) return;
      const x0 = PAPER.x + 250, w = i === 4 ? 120 : 110;
      const pts = [];
      for (let k = 0; k <= 10; k++) pts.push([x0 + w * k / 10, y - 4 + Math.sin(k * 2.3 + i) * 7 - (k % 3 === 0 ? 6 : 0)]);
      paper.push({ cmds: L.curve(pts, false, 0.8), stroke: C.bg, width: i === 4 ? 6 : 5, clipW: { x: x0 - 10, y: y - 40, w: w + 20, h: 60, p: p * 1.05 } });
      if (p < 1) tip = [x0 + w * p, y - 4 + Math.sin(p * 23 + i) * 8];
    });
    it.push({ type: "group", move: [0, py], items: paper });
    // red cross over the invoice
    it.push(...D.cross(PAPER.x + PAPER.w / 2, PAPER.y + PAPER.h / 2, 190, C.red, 11.18, { width: 18, dur: 0.13 }));
    // the gem, right of the paper
    const g0 = [970, 520];
    let sx = 1, sy = 1, dy = 0, rot = 0, mood = "smile", look = [-1, 0.5], brows = null, blink = D.within(tn, [9.7, 12.4], 0.14);
    const ent = L.clamp((tn - CUT1) / 0.4);
    const ex = 360 * (1 - L.ease.back(ent));
    if (tn > 10.84 && tn < 11.2) { // proud hop
      const u = (tn - 10.84) / 0.36;
      dy = -46 * Math.sin(u * Math.PI); sy = 1 + 0.08 * Math.sin(u * Math.PI); sx = 1 / sy; mood = "happy";
    }
    if (tn >= 11.2) {
      const w = D.wob(tn, 11.22, 0.16, 2.6, 4.5);
      sy = 1 - Math.abs(w) - 0.06 * L.clamp((tn - 11.5) / 0.4); sx = 1 + Math.abs(w) * 0.8;
      mood = tn < 11.55 ? "o" : "oops"; brows = 1; look = tn < 11.7 ? [-1, 0.3] : [1, -0.2];
      rot = -4 * L.clamp((tn - 11.6) / 0.4);
    }
    // writing: the hand follows the pencil tip, little bobs
    const writing = tn > 9.0 && tn < 11.1;
    const tipNow = tip || (writing ? [PAPER.x + 250, 330] : null);
    const pencilT = 11.75;
    let pencil = null;
    if (tn < pencilT) {
      const tp = tipNow ? tipNow : [PAPER.x + 330, 470 + 30 * Math.sin(tn * 2)];
      const lift = tip ? 0 : 18;
      pencil = { tip: [tp[0], tp[1] - lift], rot: tip ? -2 : 6 };
    }
    const gem = D.gem({ x: g0[0] + ex, y: g0[1] + 128 + dy + 6 * Math.sin(tn * 2.2), r: 128, tn, sx, sy, py: 128, px: 0, rot, mood, look, brows, blink,
      arms: { l: pencil ? [pencil.tip[0] + 44, pencil.tip[1] - 62] : [g0[0] - 140, g0[1] + 60], r: [g0[0] + 168 + ex, g0[1] + 52 + dy] } });
    if (tn > 11.6) { // sweat drop
      const u = L.clamp((tn - 11.6) / 1.1);
      const top = gem.rig.top, sxp = top[0] + 70, syp = top[1] + 34 + 40 * L.ease.in2(u);
      gem.push({ cmds: [["M", sxp, syp - 18], ["C", sxp + 6, syp - 8, sxp + 11, syp, sxp + 10, syp + 7], ["C", sxp + 8, syp + 15, sxp - 8, syp + 15, sxp - 10, syp + 7], ["C", sxp - 11, syp, sxp - 6, syp - 8, sxp, syp - 18], ["Z"]],
        fill: C.line, fillOpacity: 0.25, width: 4, strokeOpacity: 1 - u * 0.5 });
    }
    it.push(...gem);
    // pencil (held, then dropped)
    const drawPencil = (tp, deg) => {
      const items = [
        { cmds: L.poly([[0, 0], [10, -24], [26, -18]], true), fill: C.line, width: 4 },
        { cmds: L.rrect(9, -132, 18, 112, 4, 310, 0.5), fill: C.amber, width: 5 },
        { cmds: L.rrect(9, -150, 18, 20, 4, 311, 0.5), fill: C.line, width: 4.5 },
      ];
      return D.place(items, { x: tp[0], y: tp[1], rot: deg + 22, px: 0, py: 0 });
    };
    if (pencil) it.push(...drawPencil(pencil.tip, pencil.rot + (writing ? Math.sin(tn * 30) * 3 : 0)));
    else {
      const u = tn - pencilT;
      const x0 = PAPER.x + 336 + 44, y0 = 470 - 62;
      it.push(...drawPencil([x0 + 60 * u, y0 + 300 * u + 1600 * u * u], 6 + 260 * u));
    }
    // 0 / 16
    const sp = D.popS(tn, 11.32, { f: 2.2, d: 7, sq: 0.2 });
    if (sp.s > 0.01) {
      const cx = 1500, by = 540, x0 = cx - M.sw / 2;
      it.push({ type: "group", scale: { s: sp.sx, sy: sp.sy, x: cx, y: by - 70 }, items: [
        { text: "0", x: x0, y: by, size: 170, weight: 750, fill: C.red },
        { text: "/ 16", x: x0 + M.s0, y: by, size: 170, weight: 750 },
      ] });
      it.push({ type: "group", pop: { x: cx, y: 600, at: 11.7, dur: 0.3 }, items: [
        { text: "weeks right", x: cx, y: 630, size: 50, weight: 600, anchor: "middle", opacity: 0.85 },
      ] });
    }
    return it;
  }

  // ---------- C: a flag must quote the note
  const NOTE = { x: 360, y: 118, w: 1200, h: 300 };
  const C1 = { x: 150, y: 560, w: 760, h: 200 }, C2 = { x: 1010, y: 560, w: 760, h: 200 };
  const M = {}; // measured
  function flagCard(c, quote, tn) {
    const it = [{ cmds: L.rrect(c.x, c.y, c.w, c.h, 18, 401 + c.x), fill: C.body, width: 6.5 }];
    it.push(...D.flag(c.x + 64, c.y + 150, 104, tn, { fw: 62, fh: 40, wave: 3, ph: c.x }));
    if (quote) it.push({ text: quote, x: c.x + 150, y: c.y + 118, size: 48, weight: 600 });
    else {
      it.push({ text: "“", x: c.x + 150, y: c.y + 118, size: 48, weight: 600 });
      it.push({ cmds: D.scribble(c.x + 186, c.y + 102, 130, 2, 4), width: 5.5 });
      it.push({ cmds: D.scribble(c.x + 336, c.y + 102, 110, 5, 4), width: 5.5 });
      it.push({ text: "”", x: c.x + 456, y: c.y + 118, size: 48, weight: 600 });
    }
    return it;
  }
  function shotC(tn) {
    const it = [];
    const t0 = CUT2;
    // the note
    const np = L.ease.back(L.clamp((tn - t0) / 0.34));
    const note = [{ cmds: L.rrect(NOTE.x, NOTE.y, NOTE.w, NOTE.h, 16, 420), fill: C.screen, width: 6.5 }];
    // green match highlight behind "Locked the pantry"
    const hp = L.clamp((tn - 13.92) / 0.22);
    if (hp > 0) {
      const x0 = M.nx - 14, w = M.pw + 28;
      note.push({ cmds: L.rrect(x0, 236, w, 62, 14, 421, 1.2), fill: C.green, fillOpacity: 0.45, stroke: null, clipW: { x: x0 - 6, y: 226, w: w + 12, h: 84, p: L.ease.inOut(hp) } });
    }
    note.push({ text: "Jake 3 till 8:30ish ...", x: M.nx, y: 200, size: 50, weight: 500, fill: C.bg, opacity: 0.55 });
    note.push({ text: "Locked the pantry", x: M.nx, y: 284, size: 50, weight: 600, fill: C.bg });
    note.push({ text: "so he would stop snacking", x: M.nx, y: 366, size: 50, weight: 500, fill: C.bg, opacity: 0.8 });
    it.push({ type: "group", move: [0, -500 * (1 - np)], items: note });
    // card 1 (quotes the note) and card 2 (does not)
    const c1 = L.ease.back(L.clamp((tn - t0 - 0.12) / 0.36)), c2 = L.ease.back(L.clamp((tn - t0 - 0.22) / 0.36));
    const c1x = (960 - (C1.x + C1.w / 2)) * L.ease.back(L.clamp((tn - 15.55) / 0.5));
    it.push({ type: "group", move: [-900 * (1 - c1) + c1x, 0], items: flagCard(C1, "“Locked the pantry”", tn) });
    // card 2: anticipation tilt, then drops out of frame
    const dropT = 15.12;
    let c2rot = D.key(tn, [[14.92, 0], [15.06, -5, "out"], [15.12, -3]]);
    let c2y = D.key(tn, [[14.92, 0], [15.06, -16, "out"], [15.12, -12]]);
    if (tn > dropT) { const u = tn - dropT; c2y = -12 + 2600 * u * u; c2rot = -3 + 75 * u; }
    if (c2y < 800) it.push({ type: "group", move: [900 * (1 - c2), c2y], rotate: { deg: c2rot, x: C2.x + C2.w / 2, y: C2.y + C2.h / 2 }, items: flagCard(C2, null, tn) });
    // green tick badge on card 1's corner
    const tk = D.popS(tn, 14.06, { sq: 0.2 });
    const bx = C1.x + C1.w - 14, by = C1.y + 6;
    if (tk.s > 0.01) it.push({ type: "group", move: [c1x, 0], scale: { s: tk.sx, sy: tk.sy, x: bx, y: by }, items: [
      { cmds: L.blob(bx, by, 48, 48, 430, 0.02), fill: C.bg, stroke: C.green, width: 6.5 },
      ...D.tick(bx + 2, by + 2, 25, C.green, 14.1, { width: 12, dur: 0.16 }),
    ] });
    // magnifier path (arcs), with a little lag rotation
    const q1 = [C1.x + 150 + M.qw * 0.45, C1.y + 100];
    const n1 = [M.nx + M.pw * 0.5, 268];
    const q2 = [C2.x + 330, C2.y + 100];
    const keys = [[13.2, [q1[0] - 160, q1[1] + 140]], [13.42, q1, "out"], [13.58, q1], [13.92, n1, "inOut"], [14.18, n1], [14.5, q2, "inOut"],
      [14.62, q2], [14.8, [M.nx + 150, 290], "inOut"], [14.92, [M.nx + 600, 270], "inOut"], [15.02, [M.nx + 400, 290], "inOut"], [15.9, [2150, 560], "in2"]];
    M.qx = D.key(14.98, keys)[0] + 40;
    if (tn > 13.2) {
      const p = D.key(tn, keys);
      const pPrev = D.key(tn - 0.08, keys);
      const vx = p[0] - pPrev[0];
      const arc = -40 * Math.sin(L.clamp((tn - 13.58) / 0.34) * Math.PI) - 40 * Math.sin(L.clamp((tn - 14.18) / 0.32) * Math.PI);
      const s = D.popS(tn, 13.2, { sq: 0.1 }).s;
      const mag = D.magnifier(0, 0, 62, { handle: 50 + L.clamp(vx * 0.4, -18, 18) });
      it.push(...D.place(mag, { x: p[0], y: p[1] + arc, s }));
    }
    // "?" when the second quote is not in the note
    const qp = D.popS(tn, 14.98, { sq: 0.2 });
    if (qp.s > 0.01 && tn < 15.8) it.push({ type: "group", scale: { s: qp.sx, sy: qp.sy, x: M.qx, y: 70 }, opacity: 1 - L.clamp((tn - 15.5) / 0.3),
      items: [{ text: "?", x: M.qx, y: 102, size: 90, weight: 700, fill: C.amber, anchor: "middle" }] });
    return it;
  }

  const shots = [
    { start: 0, end: CUT1, camera: (tn) => ({ x: 982, y: 466, s: 1.1 + 0.03 * L.ease.inOut(L.clamp(tn / CUT1)), oy: 476 }), build: shotA },
    { start: CUT1, end: CUT2, camera: (tn, f) => {
      let dx = 0, dy = 0;
      const u = (tn - 11.2) / 0.3;
      if (u > 0 && u < 1) { const a = 9 * Math.pow(1 - u, 2); dx = L.sym(f, 71) * a; dy = L.sym(f, 73) * a; }
      return { x: 960, y: 470, oy: 470, s: 1 + 0.03 * L.clamp((tn - CUT1) / 4.5), dx, dy };
    }, build: shotB },
    { start: CUT2, end: 99, camera: (tn) => ({ x: 940, y: 450, oy: 450, s: 1 + 0.025 * L.clamp((tn - CUT2) / 3.3) }), build: shotC },
  ];

  Line.scene({
    nominal: LEN, defaultDuration: LEN, shots,
    init() {
      M.pw = L.measure("Locked the pantry", 50, 600);
      const wide = L.measure("so he would stop snacking", 50, 500);
      M.nx = NOTE.x + (NOTE.w - wide) / 2;
      M.s0 = L.measure("0 ", 170, 750);
      M.sw = L.measure("0 / 16", 170, 750);
      M.qw = L.measure("“Locked the pantry”", 48, 600);
    },
  });
})();
</script>
